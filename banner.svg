<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0575E6">
        <animate attributeName="stop-color"
          values="#0575E6;#00C9A7;#6DFF8F;#00C9A7;#0575E6"
          dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00C9A7">
        <animate attributeName="stop-color"
          values="#00C9A7;#6DFF8F;#0575E6;#6DFF8F;#00C9A7"
          dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" fill="url(#bgGrad)"/>

  <path fill="url(#waveGrad1)">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
        M0,160 C300,120 900,200 1200,150 L1200,220 L0,220 Z;
        M0,150 C300,200 900,110 1200,170 L1200,220 L0,220 Z;
        M0,160 C300,120 900,200 1200,150 L1200,220 L0,220 Z" />
  </path>

  <path fill="#ffffff" fill-opacity="0.12">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M0,190 C400,150 800,220 1200,180 L1200,220 L0,220 Z;
        M0,180 C400,220 800,150 1200,200 L1200,220 L0,220 Z;
        M0,190 C400,150 800,220 1200,180 L1200,220 L0,220 Z" />
  </path>

  <text x="50%" y="42%" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="44" font-weight="700" fill="#ffffff">
    Hi, I'm Mirza Shayyan Baig 👋
  </text>
  <text x="50%" y="58%" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="20" font-weight="400" fill="#eafff6">
    Final-Year IET Student | Full-Stack &amp; AI Systems Builder
  </text>
</svg>
