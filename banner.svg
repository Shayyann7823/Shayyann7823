<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono { font-family: 'Consolas', 'SFMono-Regular', Menlo, monospace; }
    </style>
    <clipPath id="termClip">
      <rect x="90" y="46" width="1020" height="208" rx="10" />
    </clipPath>
  </defs>

  <!-- solid background -->
  <rect width="1200" height="300" fill="#0D1117" />

  <!-- faint grid, no glow -->
  <g stroke="#1B222C" stroke-width="1" fill="none">
    <path d="M0 40 H1200" />
    <path d="M0 260 H1200" />
    <path d="M100 0 V300" />
    <path d="M1100 0 V300" />
  </g>

  <!-- terminal window -->
  <rect x="90" y="46" width="1020" height="208" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  <rect x="90" y="46" width="1020" height="32" rx="10" fill="#1C2229" />
  <rect x="90" y="68" width="1020" height="10" fill="#1C2229" />
  <circle cx="114" cy="62" r="5.5" fill="#4A5259" />
  <circle cx="132" cy="62" r="5.5" fill="#4A5259" />
  <circle cx="150" cy="62" r="5.5" fill="#4A5259" />
  <text x="600" y="67" text-anchor="middle" class="mono" font-size="12" fill="#6E7681">~/mirza-shayyan-baig</text>

  <g clip-path="url(#termClip)">
    <g class="mono" fill="#C9D1D9">
      <text x="120" y="112" font-size="17" fill="#56B6A2">
        &gt; whoami
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.02;0.06" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="120" y="140" font-size="20" font-weight="700" fill="#F0F6FC">
        Mirza Shayyan Baig
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.11;0.16" dur="9s" repeatCount="indefinite" />
      </text>

      <text x="120" y="174" font-size="17" fill="#56B6A2">
        &gt; role
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.24;0.29" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="120" y="200" font-size="17" fill="#C9D1D9">
        Final-Year IET Student · Full-Stack &amp; AI Systems Builder
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.35;0.41" dur="9s" repeatCount="indefinite" />
      </text>

      <text x="120" y="234" font-size="17" fill="#56B6A2">
        &gt; building
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.50;0.55" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="120" y="230" font-size="17" fill="#C9D1D9">
        <tspan x="120" dy="30">SecureVision — AI-powered CCTV surveillance for healthcare (FYP)</tspan>
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.62;0.68" dur="9s" repeatCount="indefinite" />
      </text>
    </g>
  </g>

  <!-- single blinking cursor, walks to the end of each finished line -->
  <rect x="0" y="0" width="9" height="17" fill="#56B6A2">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="1s" repeatCount="indefinite" />
    <animate attributeName="x"
      values="212,212, 322,322, 212,212, 610,610, 212,212, 780,780, 120,120, 700,700"
      keyTimes="0,0.055, 0.06,0.155, 0.16,0.235, 0.24,0.345, 0.35,0.405, 0.41,0.545, 0.55,0.675, 0.68,1"
      dur="9s" repeatCount="indefinite" calcMode="discrete" />
    <animate attributeName="y"
      values="99,99, 99,99, 127,127, 127,127, 161,161, 161,161, 221,221, 251,251"
      keyTimes="0,0.055, 0.06,0.155, 0.16,0.235, 0.24,0.345, 0.35,0.405, 0.41,0.545, 0.55,0.675, 0.68,1"
      dur="9s" repeatCount="indefinite" calcMode="discrete" />
  </rect>
</svg>
