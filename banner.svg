<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .display { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Consolas', 'SFMono-Regular', Menlo, monospace; }
    </style>
    <clipPath id="termClip">
      <rect x="60" y="56" width="620" height="188" rx="10" />
    </clipPath>
  </defs>

  <!-- solid background, no gradient -->
  <rect width="1200" height="300" fill="#0A0E14" />

  <!-- faint circuit / grid traces, slowly drifting -->
  <g stroke="#1B2430" stroke-width="1" fill="none" opacity="0.9">
    <path d="M0 40 H1200" />
    <path d="M0 100 H1200" />
    <path d="M0 200 H1200" />
    <path d="M0 260 H1200" />
    <path d="M150 0 V300" />
    <path d="M420 0 V300" />
    <path d="M760 0 V300" />
    <path d="M1040 0 V300" />
  </g>

  <g stroke="#1F6E5C" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M-50 250 L120 250 L160 210 L340 210 L380 170" stroke-dasharray="6 7">
      <animate attributeName="stroke-dashoffset" from="0" to="130" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M1250 60 L1040 60 L1000 100 L820 100 L780 140" stroke-dasharray="6 7">
      <animate attributeName="stroke-dashoffset" from="130" to="0" dur="7s" repeatCount="indefinite" />
    </path>
    <path d="M900 260 L900 190 L960 190 L960 40" stroke-dasharray="5 6">
      <animate attributeName="stroke-dashoffset" from="0" to="110" dur="5.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- drifting node dots along the traces -->
  <circle cx="120" cy="250" r="3" fill="#2DE1C2">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="1040" cy="60" r="3" fill="#2DE1C2">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="960" cy="40" r="3" fill="#3AA0FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.1s" repeatCount="indefinite" />
  </circle>

  <!-- terminal window -->
  <rect x="60" y="56" width="620" height="188" rx="10" fill="#0F151C" stroke="#243040" stroke-width="1.5" />
  <rect x="60" y="56" width="620" height="30" rx="10" fill="#161E27" />
  <rect x="60" y="76" width="620" height="10" fill="#161E27" />
  <circle cx="82" cy="71" r="5.5" fill="#FF5F57" />
  <circle cx="100" cy="71" r="5.5" fill="#FEBC2E" />
  <circle cx="118" cy="71" r="5.5" fill="#28C840" />
  <text x="370" y="75" text-anchor="middle" class="mono" font-size="12" fill="#5B6B7C">shayyan@dev — zsh</text>

  <g clip-path="url(#termClip)">
    <g class="mono" font-size="16" fill="#C6D1DC">
      <text x="80" y="112" fill="#2DE1C2">
        &gt; whoami
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.02;0.06" dur="8s" repeatCount="indefinite" />
      </text>
      <text x="80" y="140" font-weight="600" font-size="18" fill="#F2F5F8">
        Mirza Shayyan Baig
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.10;0.15" dur="8s" repeatCount="indefinite" />
      </text>

      <text x="80" y="172" fill="#2DE1C2">
        &gt; role
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.22;0.27" dur="8s" repeatCount="indefinite" />
      </text>
      <text x="80" y="196" fill="#C6D1DC">
        Final-Year IET Student · Full-Stack &amp; AI Systems Builder
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.32;0.38" dur="8s" repeatCount="indefinite" />
      </text>

      <text x="80" y="228" fill="#2DE1C2">
        &gt; building
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.48;0.53" dur="8s" repeatCount="indefinite" />
      </text>
    </g>
  </g>

  <!-- blinking cursor -->
  <rect x="200" y="216" width="9" height="16" fill="#2DE1C2">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.55;1" dur="1s" repeatCount="indefinite" />
    <animate attributeName="x" values="200;200;314;314" keyTimes="0;0.55;0.56;1" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- name / title block -->
  <g class="display">
    <text x="740" y="130" font-size="34" font-weight="700" fill="#F2F5F8">Hi, I'm Mirza Shayyan Baig</text>
    <text x="740" y="130" font-size="34" font-weight="700" fill="#F2F5F8" opacity="0">👋</text>
    <text x="740" y="168" font-size="17" font-weight="500" fill="#8FA3B5">Final-Year IET Student</text>
    <text x="740" y="192" font-size="17" font-weight="500" fill="#8FA3B5">Full-Stack &amp; AI Systems Builder</text>

    <rect x="742" y="206" width="0" height="3" fill="#2DE1C2">
      <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.3;0.85;1" dur="8s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
