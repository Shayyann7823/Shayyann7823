<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="50%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- Main Box -->
  <rect width="800" height="220" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="800" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtle Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160 M 0,200 L 800,200" />
    <path d="M 100,0 L 100,220 M 200,0 L 200,220 M 300,0 L 300,220 M 400,0 L 400,220 M 500,0 L 500,220 M 600,0 L 600,220 M 700,0 L 700,220" />
  </g>

  <!-- Tech Corner Brackets -->
  <path d="M 25,45 L 25,25 L 45,25" fill="none" stroke="#2ea043" stroke-width="2" opacity="0.7"/>
  <path d="M 775,45 L 775,25 L 755,25" fill="none" stroke="#2ea043" stroke-width="2" opacity="0.7"/>
  <path d="M 25,175 L 25,195 L 45,195" fill="none" stroke="#2ea043" stroke-width="2" opacity="0.7"/>
  <path d="M 775,175 L 775,195 L 755,195" fill="none" stroke="#2ea043" stroke-width="2" opacity="0.7"/>

  <!-- Name -->
  <text x="400" y="105" 
        text-anchor="middle" 
        fill="#f0f6fc" 
        font-family="'Fira Code', 'Segoe UI', monospace, sans-serif" 
        font-size="38" 
        font-weight="700" 
        letter-spacing="1">
    Mirza Shayyan Baig
  </text>

  <!-- Subtitle -->
  <text x="400" y="148" 
        text-anchor="middle" 
        fill="#3fb950" 
        font-family="'Fira Code', 'Segoe UI', monospace, sans-serif" 
        font-size="18" 
        font-weight="500" 
        letter-spacing="0.5">
    Final-Year IET Student | Full-Stack &amp; AI Systems Builder
  </text>

  <!-- Bottom Line Accent -->
  <rect x="260" y="172" width="280" height="2" rx="1" fill="url(#accentGrad)" opacity="0.8" />
</svg>
