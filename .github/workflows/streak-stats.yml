name: GitHub Readme Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"  # runs once a day at midnight UTC
  workflow_dispatch:      # lets you trigger it manually from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    name: Generate Streak Stats Image
    steps:
      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@master
        with:
          user_id: Shayyann7823
          theme: github-dark-blue
          hide_border: true
          background: "0D1117"
          ring: "56B6A2"
          fire: "56B6A2"
          currStreakLabel: "56B6A2"
